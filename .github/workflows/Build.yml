name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # required only for uploading assets to GitHub Releases

jobs:
  build:

    runs-on: windows-latest

    strategy:
      matrix:
        revitYear: [2025, 2026]

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.5.x'

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v4
      with:
        configFilePath: GitVersion.yml

    - name: Compute package version (incl prerelease)
      shell: pwsh
      run: |
        # Shared product version (SemVer) independent of Revit year
        $pkg = "$env:GitVersion_SemVer"
        $revitConst = "REVIT${{ matrix.revitYear }}"
        
        "PkgVersion=$pkg"              | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RevitVersion=${{ matrix.revitYear }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "REVIT_CONST=$revitConst"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        
        Write-Host "Computed PkgVersion: $pkg"
        Write-Host "Revit version: ${{ matrix.revitYear }}"
        Write-Host "Revit constant: $revitConst"

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x        

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x        

    - name: Restore dependencies
      run: dotnet restore ./Source/Bim.FamilyManager.slnx
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$env:REVIT_CONST"
        -p:Version="$env:PkgVersion"
        -p:PackageVersion="$env:PkgVersion"
        -p:InformationalVersion="$env:GitVersion_InformationalVersion"

    - name: Build
      run: dotnet build --no-restore ./Source/Bim.FamilyManager.slnx -c Release 
        -p:CompanyName="scotec Software Solutions AB" 
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$env:REVIT_CONST"
        -p:Version="$env:PkgVersion"
        -p:PackageVersion="$env:PkgVersion"
        -p:InformationalVersion="$env:GitVersion_InformationalVersion"

    - name: Publish
      run: dotnet publish ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj --no-restore --no-build -c Release 
        -p:PublishProfile=Properties/PublishProfiles/FolderProfile.pubxml -p:Platform=x64 
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$env:REVIT_CONST"
        -p:Version="$PkgVersion"
        -p:PackageVersion="$env:PkgVersion"
        -p:InformationalVersion="$env:GitVersion_InformationalVersion"

#    - name: Install CycloneDX SBOM Tool
#      run: dotnet tool install --global CycloneDX
#    - name: Generate SBOM
#      run: dotnet CycloneDX ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj --exclude-dev --recursive --include-project-references --output sbom --filename bom.json --output-format Json
#    - name: Copy SBOM to Publish folder
#      run: |
#        cp sbom/* Publish/

#    - name: Copy .addin file
#      run: |
#        cp ./Source/Bim.FamilyManager/Bim.FamilyManager.addin Publish/

    - name: Install WiX v4 tool (wix.exe)
      shell: pwsh
      run: |
        dotnet tool install --global wix --version 7.0.0-rc.1
        wix --version
        wix eula accept wix7
    
    - name: Run the generated WixSharp .exe to produce the .msi
      shell: pwsh
      run: |
        $exe = Resolve-Path ".\Installation\Bim.FamilyManager.Installer\bin\Release\Bim.FamilyManager.Installer.exe"
        $dir = Split-Path $exe -Parent
      
        #$p = Start-Process -FilePath $exe -WorkingDirectory $dir -Wait -PassThru
        #if ($p.ExitCode -ne 0) { throw "Installer builder failed with exit code $($p.ExitCode)" }
        
        
        Push-Location $dir
        & $exe
        $code = $LASTEXITCODE
        Pop-Location

        if ($code -ne 0) { throw "Installer builder failed with exit code $code" }

    - name: List release folder
      shell: pwsh
      run: |
        $path = ".\Installation\Bim.FamilyManager.Installer\bin\Release"
        Write-Host "Listing: $path"        Get-ChildItem -Path $path -Force |
          Select-Object Name, Length, LastWriteTime |
          Format-Table -AutoSize |
          Out-String -Width 4096 |
          Write-Host

    - name: Rename MSI
      shell: pwsh
      run: |
        $src = ".\Installation\Bim.FamilyManager.Installer\bin\Release\BIM.FamilyManager ${{ env.RevitVersion }}.msi"
        if (!(Test-Path $src)) { throw "MSI not found: $src" }
    
        $newName = "BIM.FamilyManager_${{ env.RevitVersion }}_${{ env.PkgVersion }}.msi"
        $dst = Join-Path (Split-Path $src -Parent) $newName
    
        Move-Item $src $dst -Force
        "MSI_PATH=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Renamed MSI to: $dst"

    - name: Upload .msi as artifact
      uses: actions/upload-artifact@v4
      with:
        name: BIM.FamilyManager_${{ env.RevitVersion }}_${{ env.PkgVersion }}
        path: ${{ env.MSI_PATH }}
        if-no-files-found: error

#    - name: Zip Publish folder contents
#      run: Compress-Archive -Path Publish\* -DestinationPath "BIM.FamilyManager_v${{ env.PkgVersion }}.zip"
#      shell: pwsh

#    - name: Upload Publish zip as artifact
#      uses: actions/upload-artifact@v4
#      with:
#        name: BIM.FamilyManager-${{ matrix.revitYear }}
#        path: BIM.FamilyManager_v${{env.PkgVersion}}.zip

  publish_release_assets:
    name: Attach MSIs to Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download all build artifacts (MSIs)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload MSIs to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
