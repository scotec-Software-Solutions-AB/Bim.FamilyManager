name: Build

on: [workflow_dispatch]

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.12.x'
    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
    - name: Display SemVer
      run: |
        echo "SemVer: $env:GITVERSION_SEMVER"  
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x        
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x        
    - name: Restore dependencies
      run: dotnet restore ./Source/Bim.FamilyManager.slnx
    - name: Build
      run: dotnet build --no-restore ./Source/Bim.FamilyManager.slnx -c Release -p:CompanyName="scotec Software Solutions AB" -p:Version=$env:GITVERSION_ASSEMBLYSEMFILEVER -p:FileVersion=$env:GITVERSION_ASSEMBLYSEMFILEVER -p:AssemblyVersion=$env:GITVERSION_ASSEMBLYSEMVER -p:InformationalVersion=$env:GITVERSION_SEMVER
    - name: Publish
      run: dotnet publish ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj --no-restore --no-build -c Release -p:PublishProfile=FolderProfile -p:Platform=x64 -p:Version=$env:GITVERSION_ASSEMBLYSEMFILEVER -p:FileVersion=$env:GITVERSION_ASSEMBLYSEMFILEVER -p:AssemblyVersion=$env:GITVERSION_ASSEMBLYSEMVER -p:InformationalVersion=$env:GITVERSION_SEMVER
    - name: Copy .addin file
      run: |
        mkdir -p Publish
        cp ./Source/Bim.FamilyManager/Bim.FamilyManager.addin Publish/
    - name: Zip Publish folder
      run: zip -r "Bim.FamilyManager_v${{env.GITVERSION_SEMVER}}.zip" Publish/
    - name: Upload Publish zip as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bim.FamilyManager
        path: Bim.FamilyManager_v${{env.GITVERSION_SEMVER}}.zip