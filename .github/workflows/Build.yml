name: Build

on: [workflow_dispatch]

jobs:
  build:

    runs-on: windows-2022

    strategy:
      matrix:
        revitYear: [2025, 2026]

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.12.x'

    - name: Compute package version (incl prerelease)
      shell: bash
      run: |
        BASE_VERSION="${{ matrix.revitYear }}.${GITVERSION_MINOR}.${GITVERSION_PATCH}"
        PKG_VERSION="${BASE_VERSION}${GITVERSION_PRERELEASETAGWITHDASH}"
    
        REVIT_CONST="REVIT${{ matrix.revitYear }}"
    
        echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
        echo "REVIT_CONST=$REVIT_CONST" >> $GITHUB_ENV
    
        echo "Computed PKG_VERSION: $PKG_VERSION"
        echo "DefineConstants: $REVIT_CONST"
        echo "SemVer (GitVersion): $GITVERSION_SEMVER"

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x        

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x        

    - name: Restore dependencies
      run: dotnet restore ./Source/Bim.FamilyManager.slnx
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$REVIT_CONST"

    - name: Build
      run: dotnet build --no-restore ./Source/Bim.FamilyManager.slnx -c Release 
        -p:CompanyName="scotec Software Solutions AB" 
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$REVIT_CONST"
        -p:Version="$PKG_VERSION"
        -p:PackageVersion="$PKG_VERSION"
        -p:InformationalVersion="$PKG_VERSION+$GITVERSION_SHA"

    - name: Publish
      run: dotnet publish ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj --no-restore --no-build -c Release 
        -p:PublishProfile=FolderProfile -p:Platform=x64 
        -p:RevitYear="${{ matrix.revitYear }}"
        -p:DefineConstants="$REVIT_CONST"
        -p:Version="$PKG_VERSION"
        -p:PackageVersion="$PKG_VERSION"
        -p:InformationalVersion="$PKG_VERSION+$GITVERSION_SHA"

#    - name: Install CycloneDX SBOM Tool
#      run: dotnet tool install --global CycloneDX
#    - name: Generate SBOM
#      run: dotnet CycloneDX ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj --exclude-dev --recursive --include-project-references --output sbom --filename bom.json --output-format Json
#    - name: Copy SBOM to Publish folder
#      run: |
#        cp sbom/* Publish/

    - name: Copy .addin file
      run: |
        cp ./Source/Bim.FamilyManager/Bim.FamilyManager.addin Publish/

    - name: Zip Publish folder contents
      run: Compress-Archive -Path Publish\* -DestinationPath "Bim.FamilyManager_v${{ env.GITVERSION_SEMVER }}.zip"
      shell: pwsh

    - name: Upload Publish zip as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bim.FamilyManager-${{ matrix.revitYear }}
        path: Bim.FamilyManager_v${{env.GITVERSION_SEMVER}}.zip