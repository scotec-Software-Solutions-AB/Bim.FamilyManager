name: Build

on: [workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.12.x'
    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
    - name: Display SemVer
      run: |
        echo "SemVer: $GITVERSION_SEMVER"  
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x        
    - name: Restore dependencies
      run: dotnet restore ./Source/Bim.FamilyManager.slnx
    - name: Build
      run: dotnet build --no-restore ./Source/Bim.FamilyManager.slnx -c Release -p:Version=$GITVERSION_ASSEMBLYSEMVER -p:InformationalVersion=$GITVERSION_SEMVER -p:CompanyName="scotec Software Solutions AB"
    - name: Publish
      run: dotnet publish --no-restore --no-build ./Source/Bim.FamilyManager/Bim.FamilyManager.csproj -c Release -o Publish/Bim.FamilyManager 
    - name: Copy .addin file
      run: |
        mkdir -p Publish
        cp ./Source/Bim.FamilyManager/Bim.FamilyManager.addin Publish/
    - name: Zip Publish folder
      run: zip -r "Bim.FamilyManager_v$GITVERSION_SEMVER.zip" Publish
    - name: Upload Publish zip as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bim.FamilyManager
        path: Bim.FamilyManager_v$GITVERSION_SEMVER.zip