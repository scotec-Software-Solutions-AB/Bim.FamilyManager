name: "Bug report"
description: "Report something that isn't working as expected"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please include enough detail so we can reproduce the problem.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: "When I ..., it ..., but I expected ..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide exact steps so we can reproduce the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What you expected to happen"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "What actually happened"
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      description: Did this work in a previous version?
      options:
        - "Unknown"
        - "Yes, it used to work"
        - "No, it never worked"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App/library version, tag, or commit SHA
      placeholder: "e.g. v1.2.3 or 1a2b3c4"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, tooling, and anything else relevant
      placeholder: |
        - OS:
        - Runtime (.NET/Node/etc):
        - Browser (if relevant):
        - Other:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant logs (redact secrets). Prefer text over screenshots.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, related issues, workarounds, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn’t find a duplicate
          required: true
        - label: I included steps to reproduce (or a minimal repro if possible)
          required: false
